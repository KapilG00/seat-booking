# Alembic CLI config. The database URL is NOT stored here: env.py reads it
# from the app's settings (DATABASE_URL / .env), so there is one source of truth.
#
#   uv run alembic upgrade head                      # apply migrations
#   uv run alembic revision --autogenerate -m "..."  # new migration from model changes (review it!)
#   uv run alembic check                             # fail if models and DB schema differ

[alembic]
script_location = %(here)s/app/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
