# Render Blueprint: New -> Blueprint -> pick this repo.
# Creates the API (built from ./Dockerfile) and a managed Postgres, wired together.
services:
  - type: web
    name: seat-booking-api
    runtime: docker
    plan: free            # switch to "starter" for an always-on instance (no cold starts)
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz   # traffic only reaches an instance whose DB check passes
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: seat-booking-db
          property: connectionString
      - key: DB_POOL_MAX_SIZE
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false        # set by hand in the dashboard; never committed

databases:
  - name: seat-booking-db
    plan: free
    region: singapore
    databaseName: seats
    user: app
    postgresMajorVersion: "16"
    ipAllowList: []        # internal connections only
