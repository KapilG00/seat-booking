[project]
name = "seat-booking"
version = "0.1.0"
description = "Seat reservation service that stays correct under on-sale contention"
readme = "README.md"
authors = [{ name = "KapilG00", email = "kapil.gupta4949@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
