[project]
name = "seat-booking"
version = "0.1.0"
description = "Seat reservation service that stays correct under on-sale contention"
readme = "README.md"
authors = [{ name = "KapilG00", email = "kapil.gupta4949@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "asyncpg>=0.31.0",
    "pyjwt>=2.15.1",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
